name: Recipe audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        shell: bash
        run: find kubejs -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Audit generated recipes and runtime identifiers
        run: node tools/recipe-audit.mjs --root . --check
